name: Update projections

# DraftKings and NBA.com refuse requests from GitHub's servers, so the live
# updater runs on your Mac (see mac/setup.sh). The schedule is off so these
# blocked runs can't overwrite the Mac's data; you can still start one by hand.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if every game has locked"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: projections
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check out data branch
        run: |
          git config --global user.name "sigma-dfs-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add -B data data FETCH_HEAD
          else
            git worktree add --detach data
            git -C data checkout --orphan data
            git -C data rm -rfq . || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Live updates (polls every 60s)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m pipeline.live --minutes 14 ${{ inputs.force && '--force' || '' }}
