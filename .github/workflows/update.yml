name: Update projections

# A run starts every 15 minutes (cron is UTC: 8am-1am Eastern) and, inside the
# run, polls every 60 seconds for ~14 minutes, so injury news and starting
# lineups are picked up within about a minute. Results go to the `data`
# branch, which the app reads directly.
on:
  schedule:
    - cron: "*/15 13-23 * * *"
    - cron: "*/15 0-5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if every game has locked"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: projections
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check out data branch
        run: |
          git config --global user.name "sigma-dfs-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add -B data data FETCH_HEAD
          else
            git worktree add --detach data
            git -C data checkout --orphan data
            git -C data rm -rfq . || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Live updates (polls every 60s)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m pipeline.live --minutes 14 ${{ inputs.force && '--force' || '' }}
